<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>Megha House AR</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; }
    #video { position:fixed; inset:0; width:100%; height:100%;
             object-fit:cover; z-index:0; }
    canvas  { position:fixed; inset:0; width:100%; height:100%;
             z-index:1; pointer-events:none; }

    /* ── Overlay screens ── */
    .screen {
      position:fixed; inset:0; z-index:10;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; padding:2rem;
      background:rgba(3,6,15,.9);
      backdrop-filter:blur(8px);
      font-family:'Segoe UI',sans-serif;
      transition: opacity .5s;
    }
    .screen.hidden { opacity:0; pointer-events:none; }
    .screen h2 { color:#fff; font-size:1.6rem; margin-bottom:.8rem; }
    .screen p  { color:rgba(200,220,255,.7); font-size:.9rem; line-height:1.6; }
    .icon { font-size:3.5rem; margin-bottom:1rem; }
    .spin { animation: spin 1s linear infinite; display:inline-block; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Locked screen */
    #screen-locked h2 { color:#ff4d6b; }
    #screen-locked .icon { animation: shake 0.5s ease-in-out 3; }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)}
    }

    /* HUD */
    #hud {
      position:fixed; top:1rem; left:50%; transform:translateX(-50%);
      z-index:5; display:flex; gap:.6rem;
      pointer-events:none;
    }
    .hud-chip {
      background:rgba(0,0,0,.5);
      border:1px solid rgba(0,100,255,.4);
      border-radius:99px;
      padding:.3rem .8rem;
      font-size:.72rem;
      color:rgba(100,180,255,.9);
      backdrop-filter:blur(8px);
    }

    /* Music button */
    #music-btn {
      position:fixed; bottom:2rem; right:1.5rem; z-index:6;
      width:48px; height:48px;
      background:rgba(0,0,0,.5);
      border:1px solid rgba(0,100,255,.5);
      border-radius:50%;
      font-size:1.3rem;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      backdrop-filter:blur(8px);
    }

    /* Back button */
    #back-btn {
      position:fixed; top:1rem; left:1rem; z-index:6;
      background:rgba(0,0,0,.5);
      border:1px solid rgba(255,255,255,.2);
      border-radius:12px;
      padding:.4rem .9rem;
      font-size:.8rem;
      color:#fff;
      text-decoration:none;
      backdrop-filter:blur(8px);
    }
  </style>
</head>
<body>

<!-- Camera background -->
<video id="video" autoplay muted playsinline></video>

<!-- Three.js renders here -->
<canvas id="canvas"></canvas>

<!-- Back button -->
<a href="index.html" id="back-btn">← Back</a>

<!-- HUD chips -->
<div id="hud" class="hidden">
  <div class="hud-chip">🏠 Megha House</div>
  <div class="hud-chip" id="dist-chip">📍 --m</div>
</div>

<!-- Music toggle -->
<div id="music-btn" class="hidden">🎵</div>
<audio id="bgmusic" src="assets/music.mp3" loop></audio>

<!-- Loading screen -->
<div id="screen-loading" class="screen">
  <div class="icon spin">🔵</div>
  <h2>Checking location…</h2>
  <p>Please allow Camera and Location
when the browser asks.</p>
</div>

<!-- Geo-locked screen -->
<div id="screen-locked" class="screen hidden">
  <div class="icon">🔒</div>
  <h2>Access Locked</h2>
  <p>This AR experience is only available

  at Megha House, Obbegoda Secondary School.


  Come visit us at the House Meet Day! 🎉</p>
</div>

<!-- Model loading screen -->
<div id="screen-model" class="screen hidden">
  <div class="icon spin">⚡</div>
  <h2>Loading AR…</h2>
  <p id="model-progress">Loading 3D model…</p>
</div>

<!-- Three.js + GLTFLoader from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
// ═══════════════════════════════════════════════════
// MEGHA HOUSE AR — MAIN SCRIPT
// ═══════════════════════════════════════════════════

// ──────────────────────────────────────────────────
// ⚠️  CHANGE THESE TWO VALUES TO YOUR REAL GPS COORDS
// ──────────────────────────────────────────────────
const GEO_LAT    = 6.930225;   // ← YOUR REAL LATITUDE HERE
const GEO_LON    = 81.363424;  // ← YOUR REAL LONGITUDE HERE
const GEO_RADIUS = 30;          // metres — 30m is good

// Character position: 3m in front of camera, at ground level
const CHAR_DISTANCE = 3;
const CHAR_Y        = -1.0;  // approximate ground (phone held at ~1.6m height)

// ── Utility: distance in metres between two GPS coords ──
function gpsDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180) *
            Math.cos(lat2*Math.PI/180) *
            Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ── Helper: show/hide screens ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  if(id) document.getElementById(id).classList.remove('hidden');
}

// ── Three.js globals ──
let scene, camera, renderer, mixer, clock, model;

function initThree() {
  const canvas = document.getElementById('canvas');
  renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.outputEncoding = THREE.sRGBEncoding;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 0);
  clock = new THREE.Clock();

  // Lighting — warm ambient + directional sun
  scene.add(new THREE.AmbientLight(0xffffff, 1.0));
  const sun = new THREE.DirectionalLight(0xfffe8a, 1.5);
  sun.position.set(5, 10, 5);
  sun.castShadow = true;
  scene.add(sun);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// ── Load GLB character ──
function loadCharacter() {
  showScreen('screen-model');
  const loader = new THREE.GLTFLoader();
  loader.load(
    'assets/character.glb',
    (gltf) => {
      model = gltf.scene;

      // Scale and position: 3 metres in front, at ground
      model.scale.set(1, 1, 1);
      model.position.set(0, CHAR_Y, -CHAR_DISTANCE);

      // Face the user (rotate 180° so front faces camera)
      model.rotation.y = Math.PI;

      scene.add(model);

      // Setup animation mixer
      if(gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(model);
        // Play the first animation (your idle_loop)
        const action = mixer.clipAction(gltf.animations[0]);
        action.play();
      }

      // All ready — hide overlay, show HUD
      showScreen(null);
      document.getElementById('hud').classList.remove('hidden');
      document.getElementById('music-btn').classList.remove('hidden');

      // Auto-play music (may be blocked on iOS — user taps music btn)
      document.getElementById('bgmusic').play().catch(()=>{});

      animate();
    },
    (progress) => {
      const pct = Math.round(progress.loaded/progress.total*100);
      document.getElementById('model-progress').textContent =
        `Loading 3D model… ${pct}%`;
    },
    (err) => {
      console.error('GLB load error:', err);
      document.getElementById('model-progress').textContent =
        '❌ Could not load model. Check assets/character.glb exists.';
    }
  );
}

// ── Animation loop ──
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if(mixer) mixer.update(delta);
  renderer.render(scene, camera);
}

// ── Device orientation → move camera ──
// This makes the 3D scene follow the phone's tilt
let orientReady = false;

function setupOrientation() {
  if(typeof DeviceOrientationEvent !== 'undefined') {
    window.addEventListener('deviceorientation', (e) => {
      if(!scene || !e.beta) return;
      // Map device tilt to subtle camera look-around
      const betaRad  = (e.beta  - 90) * Math.PI/180 * 0.3;
      const gammaRad = e.gamma * Math.PI/180 * 0.3;
      camera.rotation.x = -betaRad;
      camera.rotation.z = gammaRad;
    });
    orientReady = true;
  }
}

// ── Music toggle ──
const musicBtn = document.getElementById('music-btn');
let musicOn = true;
musicBtn.addEventListener('click', () => {
  const audio = document.getElementById('bgmusic');
  if(musicOn) { audio.pause(); musicBtn.textContent = '🔇'; musicOn = false; }
  else { audio.play(); musicBtn.textContent = '🎵'; musicOn = true; }
});

// ══════════════════════════════════════════
// MAIN ENTRY — Request camera then GPS
// ══════════════════════════════════════════
async function start() {
  showScreen('screen-loading');

  // 1. Start camera
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width:{ ideal:1280 }, height:{ ideal:720 } },
      audio: false
    });
    document.getElementById('video').srcObject = stream;
  } catch(e) {
    showScreen('screen-loading');
    document.querySelector('#screen-loading h2').textContent = '📷 Camera denied';
    document.querySelector('#screen-loading p').textContent =
      'Please allow camera access and refresh.';
    return;
  }

  // 2. Check GPS
  if(!navigator.geolocation) {
    showScreen('screen-locked');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const dist = gpsDistance(
        pos.coords.latitude, pos.coords.longitude,
        GEO_LAT, GEO_LON
      );
      document.getElementById('dist-chip').textContent = `📍 ${Math.round(dist)}m`;

      if(dist <= GEO_RADIUS) {
        // ✅ Inside the zone — launch AR
        initThree();
        setupOrientation();
        loadCharacter();
      } else {
        // ❌ Outside — show locked screen
        showScreen('screen-locked');
      }
    },
    (err) => {
      // GPS error — show locked
      showScreen('screen-locked');
      console.warn('GPS error:', err);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

start();
</script>
</body>
</html>
