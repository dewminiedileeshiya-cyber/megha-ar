<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
  <title>Megha House AR Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Noto+Sans+Sinhala:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; overflow:hidden; }
    body {
      background: #03060f;
      font-family: 'Syne', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .bg {
      position:fixed; inset:0; z-index:0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 0%, rgba(0,80,255,.4) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 80% 100%, rgba(0,40,160,.3) 0%, transparent 60%);
    }
    .particles { position:fixed; inset:0; z-index:0; overflow:hidden; }
    .particle {
      position:absolute;
      width:2px; height:2px;
      background:rgba(100,160,255,.6);
      border-radius:50%;
      animation: rise linear infinite;
    }
    @keyframes rise {
      from { transform:translateY(100vh) translateX(0); opacity:0; }
      10%  { opacity:1; }
      90%  { opacity:.5; }
      to   { transform:translateY(-10vh) translateX(var(--dx,20px)); opacity:0; }
    }
    .card {
      position: relative; z-index:1;
      background: rgba(5,12,28,.85);
      border: 1px solid rgba(0,100,255,.3);
      border-radius: 28px;
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow:
        0 0 60px rgba(0,80,255,.2),
        0 0 0 1px rgba(255,255,255,.04) inset;
      backdrop-filter: blur(20px);
    }
    .house-emblem {
      width: 90px; height: 90px;
      background: linear-gradient(135deg, #0055ff, #0033aa);
      border-radius: 24px;
      display: flex; align-items:center; justify-content:center;
      font-size: 2.5rem;
      margin: 0 auto 1.5rem;
      box-shadow: 0 0 30px rgba(0,80,255,.5);
      animation: glow 3s ease-in-out infinite;
    }
    @keyframes glow {
      0%,100% { box-shadow: 0 0 30px rgba(0,80,255,.5); }
      50%      { box-shadow: 0 0 50px rgba(0,120,255,.8); }
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg,#fff,#6ab0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: .4rem;
    }
    .subtitle {
      color: rgba(160,200,255,.6);
      font-size: .85rem;
      margin-bottom: 2rem;
      letter-spacing: .05em;
    }
    .desc {
      color: rgba(180,210,255,.75);
      font-size: .9rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 1.1rem;
      background: linear-gradient(135deg, #0055ff, #0033cc);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-family: 'Syne', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 8px 32px rgba(0,80,255,.4);
      animation: btn-pulse 2s ease-in-out infinite;
    }
    @keyframes btn-pulse {
      0%,100% { box-shadow: 0 8px 32px rgba(0,80,255,.4); }
      50%      { box-shadow: 0 8px 48px rgba(0,120,255,.7); }
    }
    .btn:active { transform: scale(.97); }
    .btn span { display:block; font-size:.75rem; font-weight:400; opacity:.7; margin-top:.25rem; }
    .lock-note {
      margin-top: 1.5rem;
      font-size: .75rem;
      color: rgba(150,180,255,.5);
      display: flex; align-items:center; justify-content:center; gap:.4rem;
    }
    .badge {
      display: inline-flex; align-items:center; gap:.5rem;
      background: rgba(0,80,255,.15);
      border: 1px solid rgba(0,80,255,.3);
      border-radius: 99px;
      padding: .3rem .8rem;
      font-size: .72rem;
      color: #6ab0ff;
      margin-bottom: 1.5rem;
      letter-spacing:.1em;
      text-transform:uppercase;
    }
  </style>
</head>
<body>

<div class="bg"></div>
<div class="particles" id="particles"></div>

<div class="card">
  <div class="house-emblem">🏠</div>
  <div class="badge">🎓 Obbegoda Secondary School</div>
  <h1>Megha House</h1>
  <p class="subtitle">House Meet Day · AR Experience</p>
  <p class="desc">
    Point your camera forward-

    lets go ahead with zeeno
  </p>
  <a href="ar.html" class="btn">
    ✨ Launch AR Experience
    <span>Allow camera & location when asked</span>
  </a>
  <div class="lock-note">
    🔒 Geo-locked · Only active at Megha House
  </div>
</div>

<script>
  // Create floating particles
  const container = document.getElementById('particles');
  for(let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `
      left: ${Math.random()*100}%;
      bottom: -10px;
      animation-duration: ${4 + Math.random()*6}s;
      animation-delay: ${Math.random()*5}s;
      --dx: ${(Math.random()-0.5)*60}px;
      opacity: ${0.3 + Math.random()*0.7};
    `;
    container.appendChild(p);
  }
</script>
</body>
</html>
